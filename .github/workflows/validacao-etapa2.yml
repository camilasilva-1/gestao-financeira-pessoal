name: Validacao Etapa 2

on:
  push:
    branches:
      - fix/correcoes-etapa-2
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Compilar e testar backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Executar testes de unidade
        run: mvn -B test

  frontend:
    name: Compilar frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar compilacao
        run: npm run build
